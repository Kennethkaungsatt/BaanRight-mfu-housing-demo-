<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img" aria-label="Use case diagram for BaanRight: a student translates, saves, compares and replies to Thai rental posts">
  <title>BaanRight — use case diagram</title>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Sarabun,sans-serif}
      .ttl{font-size:21px;font-weight:700;fill:#04342c}
      .sub{font-size:12px;fill:#5a6170}
      .grp{font-size:11px;font-weight:700;fill:#0f6e56;letter-spacing:.08em}
      .uc{font-size:13px;fill:#04342c}
      .line{stroke:#9aa4b4;stroke-width:1.4;fill:none}
      .actor{stroke:#04342c;stroke-width:2;fill:none}
      .actorT{font-size:14px;font-weight:700;fill:#04342c}
    </style>
  </defs>

  <rect width="980" height="640" fill="#ffffff"/>
  <text class="ttl" x="24" y="36">BaanRight — use case diagram</text>
  <text class="sub" x="24" y="54">Primary actor: an international student looking for housing near MFU.</text>

  <!-- System boundary -->
  <rect x="250" y="76" width="700" height="536" rx="12" fill="#f7faf8" stroke="#cfd5df"/>
  <text class="grp" x="266" y="98">BAANRIGHT (EXTENSION + WEB PROTOTYPE)</text>

  <!-- Actor -->
  <g>
    <circle class="actor" cx="110" cy="292" r="17"/>
    <path class="actor" d="M110 309 L110 360 M110 326 L82 350 M110 326 L138 350 M110 360 L86 402 M110 360 L134 402"/>
    <text class="actorT" x="110" y="424" text-anchor="middle">Student</text>
    <text class="sub" x="110" y="442" text-anchor="middle">MFU international</text>
  </g>

  <!-- Connector lines drawn first so ellipses cover their ends -->
  <g class="line">
    <line x1="140" y1="330" x2="420" y2="130"/>
    <line x1="140" y1="330" x2="700" y2="130"/>
    <line x1="140" y1="330" x2="420" y2="215"/>
    <line x1="140" y1="330" x2="700" y2="215"/>
    <line x1="140" y1="330" x2="420" y2="300"/>
    <line x1="140" y1="330" x2="700" y2="300"/>
    <line x1="140" y1="330" x2="420" y2="385"/>
    <line x1="140" y1="330" x2="700" y2="385"/>
    <line x1="140" y1="330" x2="420" y2="470"/>
    <line x1="140" y1="330" x2="700" y2="470"/>
  </g>

  <!-- Use cases -->
  <g>
    <ellipse cx="420" cy="130" rx="140" ry="30" fill="#ffffff" stroke="#1d9e75" stroke-width="1.6"/>
    <text class="uc" x="420" y="135" text-anchor="middle">Translate a Thai post</text>

    <ellipse cx="700" cy="130" rx="150" ry="30" fill="#ffffff" stroke="#1d9e75" stroke-width="1.6"/>
    <text class="uc" x="700" y="135" text-anchor="middle">Read extracted details</text>

    <ellipse cx="420" cy="215" rx="140" ry="30" fill="#ffffff" stroke="#1d9e75" stroke-width="1.6"/>
    <text class="uc" x="420" y="220" text-anchor="middle">Save a listing</text>

    <ellipse cx="700" cy="215" rx="150" ry="30" fill="#ffffff" stroke="#1d9e75" stroke-width="1.6"/>
    <text class="uc" x="700" y="220" text-anchor="middle">Search &amp; shortlist</text>

    <ellipse cx="420" cy="300" rx="140" ry="30" fill="#ffffff" stroke="#1d9e75" stroke-width="1.6"/>
    <text class="uc" x="420" y="305" text-anchor="middle">Ask the landlord (Thai)</text>

    <ellipse cx="700" cy="300" rx="150" ry="30" fill="#ffffff" stroke="#1d9e75" stroke-width="1.6"/>
    <text class="uc" x="700" y="305" text-anchor="middle">Attach photos</text>

    <ellipse cx="420" cy="385" rx="140" ry="30" fill="#ffffff" stroke="#1d9e75" stroke-width="1.6"/>
    <text class="uc" x="420" y="390" text-anchor="middle">Export saved CSV</text>

    <ellipse cx="700" cy="385" rx="150" ry="30" fill="#ffffff" stroke="#1d9e75" stroke-width="1.6"/>
    <text class="uc" x="700" y="390" text-anchor="middle">Set area &amp; budget alerts</text>

    <ellipse cx="420" cy="470" rx="140" ry="30" fill="#ffffff" stroke="#1d9e75" stroke-width="1.6"/>
    <text class="uc" x="420" y="475" text-anchor="middle">Translate selected text</text>

    <ellipse cx="700" cy="470" rx="150" ry="30" fill="#ffffff" stroke="#1d9e75" stroke-width="1.6"/>
    <text class="uc" x="700" y="475" text-anchor="middle">Switch light / dark theme</text>
  </g>

  <!-- Secondary actor: translation service -->
  <g>
    <rect x="300" y="540" width="300" height="46" rx="8" fill="#fff" stroke="#cfd5df"/>
    <text class="sub" x="450" y="560" text-anchor="middle">External system: MyMemory translation API</text>
    <text class="sub" x="450" y="576" text-anchor="middle">extension host permission: api.mymemory.translated.net</text>
  </g>
  <path class="line" stroke-dasharray="4 4" d="M450 540 L450 500"/>
  <text class="sub" x="456" y="520">«supports»</text>
</svg>
